[project]
name = "musicapi"
version = "0.5.0"
description = "Web interface for automatic music donwload and tracking."
authors = [
    { name="fsdmu"}
]
maintainers = [
    { name="fsdmu"}
]
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"

dependencies = [
    "aiofiles>=25.1.0",
    "aiohappyeyeballs>=2.6.1",
    "aiohttp>=3.13.2",
    "aiosignal>=1.4.0",
    "annotated-doc>=0.0.4",
    "annotated-types>=0.7.0",
    "anyio>=4.12.0",
    "attrs>=25.4.0",
    "bidict>=0.23.1",
    "certifi>=2025.11.12",
    "charset-normalizer>=3.4.4",
    "click>=8.3.1",
    "docutils>=0.22.4",
    "fastapi>=0.127.0",
    "frozenlist>=1.8.0",
    "greenlet>=3.3.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httptools>=0.7.1",
    "httpx>=0.28.1",
    "idna>=3.11",
    "ifaddr>=0.2.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown2>=2.5.4",
    "markupsafe>=3.0.3",
    "multidict>=6.7.0",
    "nicegui>=3.4.1",
    "orjson>=3.11.5",
    "propcache>=0.4.1",
    "pydantic>=2.12.5",
    "pydantic-core>=2.41.5",
    "pygments>=2.19.2",
    "python-dotenv>=1.2.1",
    "python-engineio>=4.13.1",
    "python-multipart>=0.0.21",
    "python-socketio>=5.16.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "simple-websocket>=1.1.0",
    "sniffio>=1.3.1",
    "sqlalchemy>=2.0.45",
    "starlette>=0.50.0",
    "typing-inspection>=0.4.2",
    "typing-extensions>=4.15.0",
    "urllib3>=2.6.2",
    "uvicorn>=0.40.0",
    "uvloop>=0.22.1",
    "watchfiles>=1.1.1",
    "websockets>=15.0.1",
    "wsproto>=1.3.2",
    "yarl>=1.22.0",
    "ytmusicapi>=1.11.4",
    "mysql-connector>=2.2.9",
    "psycopg2-binary>=2.9.11",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "UP"]
ignore = [
    "E203",
    "D212",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.workspace]
members = [
    "example",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
